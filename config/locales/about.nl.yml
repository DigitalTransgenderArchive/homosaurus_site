    mission_heading: "Missie"
    mission_statement: "De Homosaurus is een internationale linked data thesaurus van LHBTQ+-termen. Ontworpen als aanvulling op bredere thesauri, is de Homosaurus een solide en vernieuwende thesaurus die de vindbaarheid van LHBTQ+-bronnen en -informatie vergroot."
    page_title: "Over de Homosaurus"
    history_heading: "Geschiedenis"
    history_html: "De Homosaurus werd in 1997 ontwikkeld door <a href=\"https://www.ihlia.nl/\">IHLIA LGBTI Heritage</a> als Nederlands-Engelse thesaurus voor homo’s en lesbiennes, die als zelfstandige woordenlijst werd gebruikt om de eigen collecties te beschrijven. In 2013 maakte Jack van der Wel er, met hulp van Ellen Greenblatt, een inclusievere en hiërarchische thesaurus van. In 2015 werd het <a href=\"https://www.digitaltransgenderarchive.net\">Digital Transgender Archive</a> (DTA) een van de weinige LHBTQ+-archieven die de <a href=\"/terms\">eerste versie</a> van de Homosaurus gebruikten, en de directeur van het DTA, K.J. Rawson, werkte samen met Jack van der Wel om er een online linked data thesaurus van te maken. In 2016 richtten Rawson en Van der Wel een redactieraad op voor een <a href=\"/v2\">tweede grote herziening</a>, verschenen in mei 2019, die van de Homosaurus een LHBTQ+-specifieke thesaurus maakte als aanvulling op bestaande thesauri, gevolgd door <a href=\"/v3\">versie 3</a> in september 2021. <a href=\"/v4\">Versie 4</a>, verschenen in februari 2025, voegde Spaanse vertalingen toe, en met de latere updates groeide de Homosaurus tot meer dan 4.000 termen. <a href=\"/v5\">Versie 5</a>, verschenen in juni 2026, voegde vertalingen toe in het Duits, Frans, Japans, Nederlands en Zweeds. De voormalige redactieraad is nu het Homosaurus Collectief."
