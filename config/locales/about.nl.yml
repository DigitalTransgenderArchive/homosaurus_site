    memoriam_html: |-
      <p><strong>Walter <q>Cat</q> Walker</strong> was van 2004 tot zijn vroegtijdige overlijden in 2020 Head Cataloging Librarian aan de Loyola Marymount University in Los Angeles, Californië. Hij was ook Director-at-Large van de Gay Lesbian Bisexual Transgender Roundtable van de American Library Association (<a href="https://www.ala.org/rrt">ALA GLBTRT</a>) en was 25 jaar lang vrijwilliger bij de <a href="https://one.usc.edu/">ONE National Gay &amp; Lesbian Archives</a> van de USC Libraries.</p>

      <p>Cat Walker trad in 2016 toe tot het Homosaurus Collectief nadat hij Jack van der Wel had ontmoet op de <a href="https://web.archive.org/web/20160709112621/http://lgbtqalms.co.uk/conference-programme/">LGBTQ ALMS</a>-conferentie in Londen. Op deze conferentie hield Cat een keynote getiteld <q>Overcoming the Barriers: Improving Access to LGBTQ+ Content in Collections.</q> Cats levenslange activisme en passie voor LHBTQ+-bibliotheken en -archieven motiveerden hem om zich bij het Collectief aan te sluiten, en hij werd snel een actief lid van ons team. Op de volgende LGBTQ ALMS-conferentie in Berlijn in 2019 presenteerden Cat en Jack samen een paper over de Abridged Homosaurus.</p>

      <p>Het is moeilijk om Cats bijdragen aan de Homosaurus in de vier jaar dat hij aan het project werkte te overschatten. Toen het Collectief de eerste versie van de Homosaurus ingrijpend herzag, speelde Cat een centrale rol bij het opnemen van veel meer termen en LHBTQ+-gerelateerde contexten, representaties en geschiedenissen. Cat werkte uitgebreid aan het afstemmen van Homosaurus versie één op versie twee, onderzocht de woordenlijst nauwkeurig en haalde termen eruit die herziening nodig hadden, niet consistent waren binnen de lijst, of een unieke waarde hadden die kon worden uitgebreid voor aanverwante zoekopdrachten en behoeften. Deze lijst, bestaande uit nieuw voorgestelde termen en aanpassingen van bestaande, was een van Cats meest recente en ambitieuze bijdragen aan het werk van het Collectief. Op het moment van zijn overlijden omvatte zijn documentatie van aanverwante en voorgestelde termen meer dan 250 wijzigingen en/of nieuwe termen, belangrijk werk dat we zeker namens hem en ter ere van hem zullen afmaken.</p>

      <p>Bovenal was Cat een geduldige, vriendelijke en gulle leraar en medewerker, en hij was altijd de eerste die zich aanmeldde om nieuwe projecten op te pakken. Cats oog voor detail en zijn inzet om de Homosaurus tot een werkelijk mooie en inclusieve verzameling termen te maken zijn onmogelijk te vervangen. We zijn hem eindeloos dankbaar en vieren alles wat hij heeft bijgedragen aan dit belangrijke project.</p>
