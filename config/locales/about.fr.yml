    implementation_heading: Conseil de mise en œuvre
    implementation_description: Le Conseil de mise en œuvre travaille avec des organisations extérieures à la mise en œuvre de l’Homosaurus, élabore des pratiques de formation internes et externes, crée des ressources pour la mise en œuvre et suit l’utilisation de l’Homosaurus, son application dans la recherche et ce qui s’écrit à son sujet.
    term_development_heading: Conseil de développement terminologique
    term_development_description: Le Conseil de développement terminologique soutient le travail entre les langues et assure la coordination entre les comités de développement terminologique. Ce conseil supervise les comités propres à chaque langue (néerlandais, anglais, français, allemand, hindi et bengali, japonais, espagnol et suédois), qui sont pérennes, ainsi que les comités thématiques ad hoc, comme le comité Pasifika/Océanie, qui sont temporaires.
