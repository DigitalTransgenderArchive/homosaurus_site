    organizing_heading: Conseil d’organisation
    organizing_description: Le Conseil d’organisation assure la coordination, l’orientation et la vision d’ensemble du projet, et contribue à développer et à faire grandir le Collectif en recherchant des financements, en organisant des rencontres et en repérant des partenariats. Ce conseil comprend le Sous-comité des systèmes, qui se concentre sur les fonctionnalités du logiciel et se coordonne avec l’équipe de développement.
