    gratitude_heading: Gratitude
    gratitude_html: 'Le Collectif Homosaurus tient à remercier ses fabuleuses collaborations : <a href="https://www.asexuality.org/">AVEN</a>, <a href="https://blacklesbianarchives.substack.com/">Black Lesbian Archives</a>, <a href="https://www.colage.org/">COLAGE</a>, <a href="https://interactadvocates.org/">InterACT</a>, <a href="https://leatherarchives.org/">Leather Archives &amp; Museum</a> et <a href="https://swahpca.wordpress.com/">Sex Work Activist Histories Project</a>. Nous tenons également à remercier les nombreuses utilisatrices et nombreux utilisateurs de l’Homosaurus qui ont suggéré des termes et fourni des commentaires au fil des ans. Nous sommes particulièrement reconnaissant·es à Orla Egan, Alice Galvinhill, Ellen Greenblatt, Juniper Johnson, Dee Michel, Cailin Roles et Lydia Willoughby pour leurs contributions.'
    memoriam_heading: In memoriam
    memoriam_html: |-
      <p><strong>Walter <q>Cat</q> Walker</strong> a été bibliothécaire en chef chargé du catalogage à l’Université Loyola Marymount de Los Angeles, en Californie, de 2004 jusqu’à sa mort prématurée en 2020. Il a également été directeur général de la table ronde des gais, lesbiennes, bisexuel·les et trans de l’American Library Association (<a href="https://www.ala.org/rrt">ALA GLBTRT</a>) et a été bénévole à <a href="https://one.usc.edu/">ONE, archives nationales gaies et lesbiennes</a> des bibliothèques de l’Université de Californie du Sud pendant 25 ans.</p>

      <p>Cat Walker a rejoint le Collectif Homosaurus en 2016 après avoir rencontré Jack van der Wel lors de la conférence <a href="https://web.archive.org/web/20160709112621/http://lgbtqalms.co.uk/conference-programme/">LGBTQ ALMS</a> à Londres. Lors de cette conférence, Cat a présenté un exposé intitulé <q>Surmonter les barrières : Améliorer l’accès au contenu LGBTQ+ dans les collections.</q> L’activisme de Cat tout au long de sa vie et sa passion pour les bibliothèques et les archives LGBTQ+ l’ont incité à rejoindre le Collectif et il est rapidement devenu un membre actif de notre équipe. Lors de la conférence LGBTQ ALMS suivante, à Berlin en 2019, Cat et Jack ont présenté ensemble un article sur l’Homosaurus abrégé.</p>

      <p>Il est impossible de passer sous silence la contribution de Cat à l’Homosaurus au cours des quatre années pendant lesquelles il a travaillé sur le projet. Alors que le Collectif a révisé en profondeur la première version de l’Homosaurus, Cat a joué un rôle central en nous aidant à utiliser de nombreux autres termes et contextes, représentations et histoires liés aux personnes LGBTQ+. Cat a beaucoup travaillé sur le passage de la première à la deuxième version de l’Homosaurus, en examinant attentivement le vocabulaire et en extrayant les termes qui nécessitaient une révision, qui manquaient de cohérence dans la liste ou qui avaient une valeur unique susceptible d’être étendue à des recherches et des besoins connexes. Cette liste, composée de nouveaux termes suggérés et d’adaptations de termes existants, était l’une des contributions les plus récentes et les plus ambitieuses de Cat au travail du Collectif. Au moment de sa mort, sa documentation de termes connexes et suggérés comprenait plus de 250 changements et/ou nouveaux termes, un travail important que nous ne manquerons pas d’achever en son nom et en son honneur.</p>

      <p>Par-dessus tout, Cat était un enseignant et un collaborateur patient, aimable et bienveillant, et il était toujours le premier à se porter volontaire pour prendre en charge de nouveaux projets. Le souci du détail de Cat, ainsi que son engagement à faire de l’Homosaurus un ensemble de termes vraiment beau et inclusif, seront impossibles à remplacer. Nous lui sommes infiniment reconnaissant·es et nous célébrons tout ce qu’il a apporté à cet important projet.</p>
