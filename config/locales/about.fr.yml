  about_page:
    mission_heading: "Mission"
    mission_statement: "L'Homosaurus est un thésaurus LGBTQ+ international de données liées. Conçu pour améliorer les vocabulaires de termes généraux, l'Homosaurus est un thésaurus fiable et précis permettant de mieux découvrir les ressources et les informations portant sur les personnes, la culture et les enjeux LGBTQ+."
    page_title: "À propos de l’Homosaurus"
    history_heading: "Historique"
    history_html: "L’Homosaurus a été créé en 1997 par <a href=\"https://www.ihlia.nl/?lang=en\">IHLIA LGBTI Heritage</a>; il s’agissait alors d’un thésaurus néerlandais et anglais pour les gais et lesbiennes, utilisé comme vocabulaire autonome pour décrire leurs collections. En 2013, Jack van der Wel, avec l’aide d’Ellen Greenblatt, a transformé l’Homosaurus d’origine en un thésaurus plus inclusif et hiérarchisé. En 2015, le <a href=\"https://www.digitaltransgenderarchive.net\">Digital Transgender Archive</a> (DTA) est devenu l’un des rares centres d’archives LGBTQ+ à utiliser la <a href=\"/terms\">première version</a> de l’Homosaurus, et K.J. Rawson, à la direction du DTA, a collaboré avec Jack van der Wel pour la transformer en un vocabulaire de données liées en ligne. En 2016, Rawson et van der Wel ont mis en place un comité éditorial chargé de superviser une <a href=\"/v2\">deuxième révision majeure</a>, publiée en mai 2019, qui a transformé l’Homosaurus en un vocabulaire spécifique aux communautés LGBTQ+, destiné à compléter les thésaurus existants, suivie de la <a href=\"/v3\">version 3</a> en septembre 2021. La <a href=\"/v4\">version 4</a>, publiée en février 2025, a ajouté des traductions en espagnol, et ses mises à jour suivantes ont porté le vocabulaire à plus de 4 000 termes. La <a href=\"/v5\">version 5</a>, publiée en juin 2026, a ajouté des traductions en allemand, en français, en japonais, en néerlandais et en suédois. L’ancien comité éditorial est aujourd’hui le Collectif Homosaurus."
    emails_revealed: Les adresses courriel de la page sont maintenant affichées.
    collective_heading: Collectif Homosaurus
    collective_intro: 'Le Collectif Homosaurus compte plus de 40 membres dans 9 pays, organisé en trois conseils interdépendants : le Conseil d’organisation, le Conseil de mise en œuvre et le Conseil de développement terminologique.'
