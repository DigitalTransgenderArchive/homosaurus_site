    implementation_heading: कार्यान्वयन बोर्ड
    implementation_description: 'कार्यान्वयन बोर्ड बाहरी संगठनों के साथ मिलकर होमोसॉरस के कार्यान्वयन पर काम करता है: आंतरिक और बाहरी दोनों प्रकार की प्रशिक्षण पद्धतियाँ विकसित करता है, कार्यान्वयन संसाधन तैयार करता है, और होमोसॉरस के उपयोग, उसके विद्वतापूर्ण अनुप्रयोग तथा उस पर लिखे गए लेखन का लेखा-जोखा रखता है।'
    term_development_heading: शब्द विकास बोर्ड
    term_development_description: शब्द विकास बोर्ड भाषाओं के बीच के कार्य में सहयोग करता है और शब्द विकास समितियों के बीच समन्वय प्रदान करता है। यह बोर्ड डच, अंग्रेजी, फ्रेंच, जर्मन, हिंदी और बंगाली, जापानी, स्पेनिश तथा स्वीडिश भाषा-विशिष्ट समितियों की देखरेख करता है, जो दीर्घकालिक रूप से चलती हैं, और साथ ही तदर्थ विषयगत समितियों की भी, जैसे पैसिफ़िका/ओशिनिया समिति, जो अस्थायी स्वरूप की हैं।
