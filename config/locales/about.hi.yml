hi:
  about_page:
    mission_heading: "उद्देश्य"
    mission_statement: "होमोसौरस एलजीबीटीक्यू+ शब्दों की एक अंतरराष्ट्रीय लिंक्ड डेटा शब्दावली है। व्यापक विषय शब्द शब्दावली को बढ़ाने के लिए डिज़ाइन किया गया, होमोसॉरस एक मजबूत और अत्याधुनिक थीसॉरस है जो एलजीबीटीक्यू+ संसाधनों और जानकारी की खोज को आगे बढ़ाता है।"
    page_title: "होमोसॉरस के बारे में"
    history_heading: "इतिहास"
    history_html: "होमोसॉरस मूल रूप से 1997 में <a href=\"https://www.ihlia.nl/?lang=en\">IHLIA LGBTI हेरिटेज</a> द्वारा एक डच और अंग्रेजी समलैंगिक और लेस्बियन थीसॉरस के रूप में बनाया गया था जिसका उपयोग उनके संग्रह का वर्णन करने के लिए एक स्टैंडअलोन शब्दावली के रूप में किया गया था। 2013 में, जैक वैन डेर वेल ने एलेन ग्रीनब्लैट की मदद से मूल होमोसॉरस को अधिक समावेशी और श्रेणीबद्ध थीसॉरस में बदल दिया। 2015 में, <a href=\"https://www.digitaltransgenderarchive.net\">डिजिटल ट्रांसजेंडर आर्काइव</a> (डीटीए) होमोसॉरस के <a href=\"/terms\">पहले संस्करण</a> का उपयोग करने वाले मुट्ठी भर एलजीबीटीक्यू+ अभिलेखागार में से एक बन गया, और डीटीए के निदेशक पद पर कार्यरत के.जे. रॉसन ने इसे ऑनलाइन लिंक्ड डेटा शब्दावली में बदलने के लिए जैक वैन डेर वेल के साथ सहयोग किया। 2016 में, रॉसन और वैन डेर वेल ने होमोसॉरस के <a href=\"/v2\">दूसरे प्रमुख संशोधन</a> (मई 2019 में जारी) की देखरेख के लिए एक संपादकीय बोर्ड की स्थापना की। इस संशोधन ने होमोसॉरस को एक एलजीबीटीक्यू+-विशिष्ट शब्दावली में बदल दिया, जिसका उद्देश्य मौजूदा थीसॉरी को पूरक करना था, और सितंबर 2021 में <a href=\"/v3\">संस्करण 3</a> जारी किया गया। फ़रवरी 2025 में जारी <a href=\"/v4\">संस्करण 4</a> में स्पेनिश अनुवाद जोड़े गए, और इसके बाद के अद्यतनों में शब्दावली 4,000 से अधिक शब्दों तक पहुँच गई। जून 2026 में जारी <a href=\"/v5\">संस्करण 5</a> में डच, फ़्रेंच, जर्मन, जापानी और स्वीडिश अनुवाद जोड़े गए। पूर्व संपादकीय बोर्ड अब होमोसॉरस सामूहिक है।"
    emails_revealed: पृष्ठ पर दिए गए ईमेल पते अब दिखाए गए हैं।
    collective_heading: होमोसॉरस सामूहिक
    collective_intro: 'होमोसॉरस सामूहिक में 9 देशों के 40 से अधिक सदस्य हैं, जो तीन परस्पर निर्भर बोर्डों में बँटे हैं: आयोजन बोर्ड, कार्यान्वयन बोर्ड और शब्द विकास बोर्ड।'
