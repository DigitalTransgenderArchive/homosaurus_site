    organizing_heading: आयोजन बोर्ड
    organizing_description: 'आयोजन बोर्ड पूरी परियोजना में समन्वय, दृष्टि-निर्माण और मार्गदर्शन प्रदान करता है, तथा सामूहिक के विकास और विस्तार में सहयोग करता है: धन जुटाना, सम्मेलनों का आयोजन करना और साझेदारियाँ खोजना इसके कार्य हैं। इस बोर्ड में सिस्टम उप-समिति शामिल है, जो सॉफ़्टवेयर की कार्यक्षमता पर ध्यान देती है और डेवलपरों के साथ समन्वय करती है।'
