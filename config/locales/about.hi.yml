    acknowledgements_heading: आभार और कृतज्ञता
    former_members_heading: पूर्व सदस्य
    former_members_intro: 'होमोसॉरस सामूहिक, सामूहिक के पूर्व सदस्यों के श्रम और लगाव के लिए उन्हें धन्यवाद देना चाहता है:'
    most_notably: 'और विशेष रूप से, खुलकर:'
    gratitude_heading: आभार
    gratitude_html: 'होमोसॉरस सामूहिक हमारे शानदार सहयोगियों को धन्यवाद देना चाहता है: <a href="https://www.asexuality.org/">AVEN</a>, <a href="https://blacklesbianarchives.substack.com/">Black Lesbian Archives</a>, <a href="https://www.colage.org/">COLAGE</a>, <a href="https://interactadvocates.org/">InterACT</a>, <a href="https://leatherarchives.org/">Leather Archives &amp; Museum</a> और <a href="https://swahpca.wordpress.com/">Sex Work Activist Histories Project</a>। हम होमोसॉरस के कई उपयोगकर्ताओं को भी धन्यवाद देना चाहते हैं जिन्होंने वर्षों से शब्दों का सुझाव दिया है और फ़ीडबैक दिया है। विशेष रूप से, हम उनके योगदान के लिए ओर्ला ईगन, एलिस गैल्विनहिल, एलेन ग्रीनब्लैट, जुनिपर जॉनसन, डी मिशेल, कैलीन रोल्स और लिडिया विलोबी के आभारी हैं।'
    memoriam_heading: स्मृति में
    memoriam_html: |-
      <p><strong>वाल्टर <q>कैट</q> वॉकर</strong> ने 2004 से 2020 में अपनी असामयिक मृत्यु तक लॉस एंजिल्स, कैलिफोर्निया में लोयोला मैरीमाउंट यूनिवर्सिटी में हेड कैटलॉगिंग लाइब्रेरियन के रूप में कार्य किया। वह अमेरिकन लाइब्रेरी एसोसिएशन के गे लेस्बियन बाइसेक्सुअल ट्रांसजेंडर राउंडटेबल (<a href="https://www.ala.org/rrt">ALA GLBTRT</a>) के डायरेक्टर-एट-लार्ज भी थे और उन्होंने यूएससी लाइब्रेरीज़ में <a href="https://one.usc.edu/">ONE National Gay &amp; Lesbian Archives</a> में 25 वर्षों तक स्वेच्छा से काम किया।</p>

      <p>लंदन में <a href="https://web.archive.org/web/20160709112621/http://lgbtqalms.co.uk/conference-programme/">LGBTQ ALMS</a> सम्मेलन में जैक वैन डेर वेल से मुलाकात के बाद कैट वॉकर 2016 में होमोसॉरस सामूहिक में शामिल हो गए। इस सम्मेलन में, कैट ने <q>बाधाओं पर काबू पाना: संग्रह में एलजीबीटीक्यू+ सामग्री तक पहुंच में सुधार</q> शीर्षक से एक मुख्य भाषण प्रस्तुत किया। एलजीबीटीक्यू+ पुस्तकालयों और अभिलेखागार के लिए कैट की आजीवन सक्रियता और जुनून ने उन्हें सामूहिक में शामिल होने के लिए प्रेरित किया और वह जल्दी ही हमारी टीम के एक सक्रिय सदस्य बन गए। 2019 में बर्लिन में अगले LGBTQ ALMS सम्मेलन में, कैट और जैक ने संक्षिप्त होमोसॉरस पर एक साथ एक पेपर प्रस्तुत किया।</p>

      <p>इस परियोजना पर चार वर्षों तक काम करने के दौरान होमोसॉरस में कैट के योगदान को बढ़ा-चढ़ाकर बताना मुश्किल है। जैसे ही सामूहिक ने होमोसॉरस के पहले संस्करण को नाटकीय रूप से संशोधित किया, कैट ने हमें कई और शब्दों और एलजीबीटीक्यू+-संबंधित संदर्भों, अभ्यावेदन और इतिहास का उपयोग करने में मदद करने में केंद्रीय भूमिका निभाई। कैट ने होमोसॉरस संस्करण एक से संस्करण दो तक सामंजस्य स्थापित करने, शब्दावली की बारीकी से जांच करने और उन शब्दों को खींचने पर बड़े पैमाने पर काम किया, जिनमें संशोधन की आवश्यकता थी, सूची में स्थिरता की कमी थी, या एक अद्वितीय मूल्य था जिसे संबंधित खोजों और जरूरतों के लिए बढ़ाया जा सकता था। नए सुझाए गए शब्दों के साथ-साथ मौजूदा शब्दों के अनुकूलन से बनी यह सूची, सामूहिक के काम में कैट के सबसे हालिया और महत्वाकांक्षी योगदानों में से एक थी। उनकी मृत्यु के समय, संबंधित और सुझाए गए शब्दों के उनके दस्तावेज़ीकरण में 250 से अधिक परिवर्तन और/या नए शब्द शामिल थे, महत्वपूर्ण कार्य जिसे हम उनकी ओर से और उनके सम्मान में पूरा करना सुनिश्चित करेंगे।</p>

      <p>सबसे बढ़कर, कैट एक धैर्यवान, दयालु और शालीन शिक्षक और सहयोगी थे और वह हमेशा नई परियोजनाओं के लिए स्वेच्छा से आगे आने वाले पहले व्यक्ति थे। विस्तार पर कैट का ध्यान, साथ ही होमोसॉरस को वास्तव में सुंदर और समावेशी शब्दों का सेट बनाने की उनकी प्रतिबद्धता को प्रतिस्थापित करना असंभव होगा। हम उनके प्रति अत्यंत आभारी हैं क्योंकि हम इस महत्वपूर्ण परियोजना में उनके योगदान का जश्न मनाते हैं।</p>
