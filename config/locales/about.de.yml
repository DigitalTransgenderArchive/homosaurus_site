    implementation_heading: Implementierungsgremium
    implementation_description: Das Implementierungsgremium arbeitet mit externen Organisationen an der Umsetzung des Homosaurus. Es entwickelt interne und externe Schulungskonzepte, erstellt Ressourcen für die Implementierung und verfolgt die Nutzung sowie die wissenschaftliche Anwendung und Rezeption des Homosaurus.
    term_development_heading: Terminologiegremium
    term_development_description: Das Terminologiegremium unterstützt die sprachübergreifende Zusammenarbeit und koordiniert die verschiedenen Terminologie-Komitees. Das Gremium betreut die langfristig angelegten sprachspezifischen Komitees für Niederländisch, Englisch, Französisch, Deutsch, Hindi und Bengalisch, Japanisch, Spanisch und Schwedisch. Zudem begleitet es thematische Ad-hoc-Komitees wie das Pasifika/Ozeanien-Komitee, die zeitlich befristet arbeiten.
