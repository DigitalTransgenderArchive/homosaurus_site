    gratitude_heading: Dank
    gratitude_html: 'Das Homosaurus-Kollektiv dankt den großartigen Kooperationspartner:innen: <a href="https://www.asexuality.org/">AVEN</a>, <a href="https://blacklesbianarchives.substack.com/">Black Lesbian Archives</a>, <a href="https://www.colage.org/">COLAGE</a>, <a href="https://interactadvocates.org/">InterACT</a>, <a href="https://leatherarchives.org/">Leather Archives &amp; Museum</a> sowie <a href="https://swahpca.wordpress.com/">Sex Work Activist Histories Project</a>. Außerdem danken wir den zahlreichen Nutzer:innen des Homosaurus, die im Laufe der Jahre Begriffe vorgeschlagen und Rückmeldungen gegeben haben. Besonders dankbar sind wir Orla Egan, Alice Galvinhill, Ellen Greenblatt, Juniper Johnson, Dee Michel, Cailin Roles und Lydia Willoughby für ihre Beiträge.'
