    mission_heading: "Auftrag"
    mission_statement: "Der Homosaurus ist ein internationales Linked-Data-Vokabular mit LGBTIQ+-Begriffen. Als Ergänzung zu allgemeinen bibliothekarischen Schlagwortsystemen entwickelt, ist der Homosaurus ein solider und zukunftsweisender Thesaurus, der die Auffindbarkeit von LGBTIQ+-Ressourcen und -Informationen verbessert."
    page_title: "Über den Homosaurus"
    history_heading: "Geschichte"
    history_html: "Der Homosaurus wurde 1997 von <a href=\"https://www.ihlia.nl/?lang=en\">IHLIA LGBTI Heritage</a> als niederländisch-englischer schwul-lesbischer Thesaurus entwickelt, der als eigenständiges Vokabular zur Beschreibung der eigenen Sammlungen diente. 2013 baute Jack van der Wel ihn mit Unterstützung von Ellen Greenblatt zu einem inklusiveren und hierarchischen Thesaurus aus. 2015 nutzte das <a href=\"https://www.digitaltransgenderarchive.net\">Digital Transgender Archive</a> (DTA) als eines von wenigen LGBTIQ+-Archiven die <a href=\"/terms\">erste Version</a> des Homosaurus, und K.J. Rawson, Leitung des DTA, machte ihn gemeinsam mit Jack van der Wel zu einem Online-Linked-Data-Vokabular. 2016 gründeten Rawson und van der Wel ein Redaktionsgremium für eine <a href=\"/v2\">zweite große Überarbeitung</a>, veröffentlicht im Mai 2019, die den Homosaurus zu einem LGBTIQ+-spezifischen Vokabular machte, das bestehende Thesauri ergänzen soll; im September 2021 folgte <a href=\"/v3\">Version 3</a>. <a href=\"/v4\">Version 4</a> erschien im Februar 2025 und brachte spanische Übersetzungen; mit den späteren Aktualisierungen wuchs das Vokabular auf über 4.000 Begriffe. <a href=\"/v5\">Version 5</a> erschien im Juni 2026 und fügte Übersetzungen ins Deutsche, Französische, Japanische, Niederländische und Schwedische hinzu. Das ehemalige Redaktionsgremium ist heute das Homosaurus-Kollektiv."
    emails_revealed: E-Mail-Adressen auf der Seite sind jetzt sichtbar.
    collective_heading: Homosaurus-Kollektiv
    collective_intro: 'Das Homosaurus-Kollektiv besteht aus mehr als 40 Mitgliedern aus neun Ländern und gliedert sich in drei voneinander abhängige Gremien: Organisationsgremium, Implementierungsgremium und Terminologiegremium.'
