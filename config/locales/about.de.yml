    organizing_heading: Organisationsgremium
    organizing_description: Das Organisationsgremium übernimmt die Koordination, strategische Ausrichtung und Begleitung des Projekts. Zudem unterstützt es den Aufbau und die Weiterentwicklung des Kollektivs, kümmert sich um die Finanzierung, organisiert Treffen und initiiert Partnerschaften. Zu diesem Gremium gehört auch das System-Komitee, das sich auf die Funktionalität der Software konzentriert und die Zusammenarbeit mit Entwickler:innen koordiniert.
