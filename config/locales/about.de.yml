    memoriam_html: |-
      <p><strong>Walter <q>Cat</q> Walker</strong> war von 2004 bis zu seinem frühen Tod im Jahr 2020 leitender Katalogisierungsbibliothekar an der Loyola Marymount University in Los Angeles, Kalifornien. Er war außerdem Director-at-Large des Gay Lesbian Bisexual Transgender Roundtable der American Library Association (<a href="https://www.ala.org/rrt">ALA GLBTRT</a>) und engagierte sich 25 Jahre lang ehrenamtlich im <a href="https://one.usc.edu/">ONE National Gay &amp; Lesbian Archives</a> der USC Libraries.</p>

      <p>Cat Walker kam 2016 zum Homosaurus-Kollektiv, nachdem er Jack van der Wel auf der <a href="https://web.archive.org/web/20160709112621/http://lgbtqalms.co.uk/conference-programme/">LGBTQ ALMS</a>-Konferenz in London kennengelernt hatte. Auf dieser Konferenz hielt Cat eine Keynote mit dem Titel <q>Overcoming the Barriers: Improving Access to LGBTQ+ Content in Collections.</q> Cats lebenslanger Aktivismus und seine Leidenschaft für LGBTIQ+-Bibliotheken und -Archive motivierten ihn, dem Kollektiv beizutreten, und er wurde schnell zu einem aktiven Mitglied unseres Teams. Auf der nächsten LGBTQ ALMS-Konferenz 2019 in Berlin stellten Cat und Jack gemeinsam einen Beitrag zum Abridged Homosaurus vor.</p>

      <p>Cats Beitrag zum Homosaurus in den vier Jahren seiner Mitarbeit am Projekt lässt sich kaum überschätzen. Als das Kollektiv die erste Version des Homosaurus grundlegend überarbeitete, spielte Cat eine zentrale Rolle dabei, viele weitere Begriffe sowie LGBTIQ+-bezogene Kontexte, Darstellungen und Geschichten zu berücksichtigen. Cat arbeitete intensiv am Abgleich von Homosaurus Version eins mit Version zwei, prüfte das Vokabular genau und zog Begriffe heraus, die überarbeitet werden mussten, in der Liste uneinheitlich waren oder einen besonderen Wert hatten, der sich für verwandte Suchanfragen und Bedürfnisse erweitern ließ. Diese Liste, bestehend aus neu vorgeschlagenen Begriffen sowie Anpassungen bestehender, war einer von Cats jüngsten und ehrgeizigsten Beiträgen zur Arbeit des Kollektivs. Zum Zeitpunkt seines Todes umfasste seine Dokumentation verwandter und vorgeschlagener Begriffe über 250 Änderungen und/oder neue Begriffe, wichtige Arbeit, die wir in seinem Namen und zu seinen Ehren abschließen werden.</p>

      <p>Vor allem war Cat ein geduldiger, freundlicher und zugewandter Lehrer und Mitstreiter, und er meldete sich stets als Erster, um neue Projekte zu übernehmen. Cats Liebe zum Detail und sein Anspruch, den Homosaurus zu einer wirklich schönen und inklusiven Sammlung von Begriffen zu machen, werden sich nicht ersetzen lassen. Wir sind ihm unendlich dankbar und feiern alles, was er zu diesem wichtigen Projekt beigetragen hat.</p>
