    gratitude_heading: Gratitudine
    gratitude_html: 'Il Collettivo Homosaurus ringrazia le sue splendide collaborazioni: <a href="https://www.asexuality.org/">AVEN</a>, <a href="https://blacklesbianarchives.substack.com/">Black Lesbian Archives</a>, <a href="https://www.colage.org/">COLAGE</a>, <a href="https://interactadvocates.org/">InterACT</a>, <a href="https://leatherarchives.org/">Leather Archives &amp; Museum</a> e <a href="https://swahpca.wordpress.com/">Sex Work Activist Histories Project</a>. Ringraziamo anche le molte persone che usano Homosaurus e che nel corso degli anni hanno proposto termini e dato riscontri. In particolare siamo grati a Orla Egan, Alice Galvinhill, Ellen Greenblatt, Juniper Johnson, Dee Michel, Cailin Roles e Lydia Willoughby per i loro contributi.'
    memoriam_heading: In memoria
    memoriam_html: |-
      <p><strong>Walter <q>Cat</q> Walker</strong> è stato responsabile della catalogazione presso la Loyola Marymount University di Los Angeles, in California, dal 2004 fino alla sua prematura scomparsa nel 2020. Era inoltre Director-at-Large della Gay Lesbian Bisexual Transgender Roundtable dell’American Library Association (<a href="https://www.ala.org/rrt">ALA GLBTRT</a>) e per 25 anni ha prestato volontariato presso gli <a href="https://one.usc.edu/">ONE National Gay &amp; Lesbian Archives</a> delle USC Libraries.</p>

      <p>Cat Walker è entrato nel Collettivo Homosaurus nel 2016, dopo aver conosciuto Jack van der Wel alla conferenza <a href="https://web.archive.org/web/20160709112621/http://lgbtqalms.co.uk/conference-programme/">LGBTQ ALMS</a> di Londra. In quell’occasione Cat ha tenuto un intervento principale intitolato <q>Overcoming the Barriers: Improving Access to LGBTQ+ Content in Collections.</q> L’attivismo di una vita e la passione di Cat per le biblioteche e gli archivi LGBTQ+ lo hanno spinto a unirsi al Collettivo, e in breve tempo è diventato un membro attivo del nostro gruppo. Alla conferenza LGBTQ ALMS successiva, a Berlino nel 2019, Cat e Jack hanno presentato insieme un articolo su Homosaurus in versione ridotta.</p>

      <p>È difficile sopravvalutare i contributi di Cat a Homosaurus nei quattro anni in cui ha lavorato al progetto. Mentre il Collettivo rivedeva in profondità la prima versione di Homosaurus, Cat ha avuto un ruolo centrale nell’aiutarci a includere molti più termini e contesti, rappresentazioni e storie legati al mondo LGBTQ+. Cat ha lavorato a lungo alla riconciliazione tra la versione uno e la versione due di Homosaurus: ha esaminato il vocabolario con grande attenzione ed estratto i termini che andavano rivisti, che erano incoerenti rispetto al resto dell’elenco o che avevano un valore particolare, estendibile a ricerche ed esigenze affini. Questo elenco, composto da nuovi termini proposti e da adattamenti di termini esistenti, è stato uno dei contributi più recenti e ambiziosi di Cat al lavoro del Collettivo. Al momento della sua scomparsa, la sua documentazione di termini correlati e proposti comprendeva oltre 250 modifiche e/o nuovi termini, un lavoro importante che ci impegniamo a completare per suo conto e in suo onore.</p>

      <p>Soprattutto, Cat è stato un insegnante e un collaboratore paziente, gentile e generoso, sempre il primo a offrirsi per nuovi progetti. L’attenzione di Cat ai dettagli, insieme al suo impegno nel fare di Homosaurus un insieme di termini davvero bello e inclusivo, sarà impossibile da sostituire. Gli siamo infinitamente grati mentre celebriamo tutto ciò che ha dato a questo importante progetto.</p>
