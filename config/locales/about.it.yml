    organizing_heading: Consiglio organizzativo
    organizing_description: Il consiglio organizzativo si occupa di coordinamento, visione e orientamento dell’intero progetto, e favorisce lo sviluppo e la crescita del Collettivo cercando finanziamenti, organizzando incontri e individuando partenariati. Di questo consiglio fa parte il sottocomitato per i sistemi, che si occupa delle funzionalità del software e si coordina con chi lo sviluppa.
