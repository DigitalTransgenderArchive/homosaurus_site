it:
  about_page:
    mission_heading: "Missione"
    mission_statement: "Homosaurus è un vocabolario linked data internazionale di termini LGBTQ+. Pensato come complemento ai soggettari generali, Homosaurus è un tesauro solido e all’avanguardia che migliora la reperibilità di risorse e informazioni LGBTQ+."
    page_title: "Informazioni su Homosaurus"
    history_heading: "Storia"
    history_html: "Homosaurus fu creato nel 1997 da <a href=\"https://www.ihlia.nl/?lang=en\">IHLIA LGBTI Heritage</a> come tesauro gay e lesbico in olandese e inglese, usato come vocabolario autonomo per descrivere le proprie collezioni. Nel 2013 Jack van der Wel, con l’aiuto di Ellen Greenblatt, lo trasformò in un tesauro più inclusivo e gerarchico. Nel 2015 il <a href=\"https://www.digitaltransgenderarchive.net\">Digital Transgender Archive</a> (DTA) fu uno dei pochi archivi LGBTQ+ a usare la <a href=\"/terms\">prima versione</a> di Homosaurus, e K.J. Rawson, alla direzione del DTA, collaborò con Jack van der Wel per trasformarla in un vocabolario linked data accessibile online. Nel 2016 Rawson e van der Wel istituirono un comitato editoriale per una <a href=\"/v2\">seconda importante revisione</a>, pubblicata a maggio 2019, che rese Homosaurus un vocabolario specifico per le tematiche LGBTQ+ e pensato come complemento ai tesauri esistenti, seguita dalla <a href=\"/v3\">versione 3</a> a settembre 2021. La <a href=\"/v4\">versione 4</a>, uscita a febbraio 2025, aggiunse le traduzioni in spagnolo, e con gli aggiornamenti successivi il vocabolario superò i 4.000 termini. La <a href=\"/v5\">versione 5</a>, pubblicata a giugno 2026, aggiunse le traduzioni in francese, giapponese, olandese, svedese e tedesco. L’ex comitato editoriale è oggi il Collettivo Homosaurus."
    emails_revealed: Gli indirizzi email nella pagina sono ora visibili.
    collective_heading: Collettivo Homosaurus
    collective_intro: 'Il Collettivo Homosaurus conta più di 40 componenti in 9 paesi, suddivisi in tre consigli interdipendenti: il consiglio organizzativo, il consiglio per l’implementazione e il consiglio per lo sviluppo dei termini.'
