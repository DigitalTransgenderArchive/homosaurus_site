    implementation_heading: Consiglio per l’implementazione
    implementation_description: 'Il consiglio per l’implementazione collabora con organizzazioni esterne all’adozione di Homosaurus: sviluppa pratiche di formazione interne ed esterne, crea risorse per l’implementazione e monitora l’uso di Homosaurus, la sua applicazione in ambito scientifico e ciò che viene scritto su di esso.'
    term_development_heading: Consiglio per lo sviluppo dei termini
    term_development_description: Il consiglio per lo sviluppo dei termini sostiene il lavoro multilingue e coordina i comitati per lo sviluppo dei termini. Supervisiona i comitati linguistici olandese, inglese, francese, tedesco, hindi e bengalese, giapponese, spagnolo e svedese, attivi a lungo termine, e i comitati tematici ad hoc, come il comitato Pasifika/Oceania, che sono temporanei.
