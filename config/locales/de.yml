  homepage:
    welcome_html: '<p>Willkommen beim Homosaurus! Der Homosaurus ist ein internationales Linked-Data-Vokabular mit lesbischen, schwulen, bisexuellen, trans, inter* und queeren Begriffen (LGBTIQ+-Begriffen). Das Vokabular versteht sich als Ergänzung zu allgemeinen bibliothekarischen Schlagwortsystemen. Archive, Bibliotheken, Museen und andere Institutionen sind eingeladen, den Homosaurus zur Unterstützung der LGBTIQ+-Forschung einzusetzen und so die Auffindbarkeit ihrer LGBTIQ+-Bestände zu verbessern.</p><p>Wenn du Interesse an Homosaurus-Merchandise hast, besuche gerne unseren <a href="https://homosaurus.threadless.com">Online-Shop</a>. Sämtliche Einnahmen kommen dem Projekt zugute oder werden an LGBTIQ+-Organisationen gespendet.</p><p>Hinweis: Die Erarbeitung einer deutschen Version des Homosaurus startete 2025 als Teilprojekt von QueerSearch, dem Dachverband deutschsprachiger queerer Archive, Bibliotheken und Sammlungen. Noch ist die Übersetzung nicht abgeschlossen, rund die Hälfte der englischen Begriffe sind inzwischen jedoch auf Deutsch verfügbar. Wir arbeiten mit Hochdruck an den weiteren Übersetzungen und freuen uns bis dahin über Inputs, Änderungs- oder Ergänzungsvorschläge auf: <a href="mailto:homosaurus@queersearch.org">homosaurus@queersearch.org</a></p><p>Auch das internationale Homosaurus-Kollektiv freut sich über deine Rückmeldungen, am einfachsten direkt über das <a href="%{contact_path}">Kontaktformular</a>. Kontaktiere uns gerne, erzähle uns, wie du das Vokabular einsetzt und teile dein Feedback mit uns. Außerdem kannst du unserer Community bei <a href="https://groups.google.com/g/homoitcommunity">Google Groups</a> beitreten.</p>'
