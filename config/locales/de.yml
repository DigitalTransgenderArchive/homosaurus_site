    message: Deine Nachricht
    message_html: 'Wenn du den Homosaurus nutzt, freuen wir uns über deine Rückmeldung.</br>Hast du Vorschläge für Neueinträge oder begründete Hinweise zu bestehenden Einträgen? Der Homosaurus ist ein fortlaufendes Projekt: Melde dich doch direkt beim deutschsprachigen Homosaurus-Team unter <a href="mailto:homosaurus@queersearch.org">homosaurus@queersearch.org</a>.</br>Hast du eine Rückmeldung an das internationale Homosaurus-Kollektiv? Dann kontaktiere uns gerne über das Kontaktformular unten und erzähle uns, wie du dieses Vokabular verwendest und welches Feedback oder welche Anregungen du dazu hast. Gelegentlich suchen wir zudem neue Mitglieder für das Kollektiv. Lass uns also gerne wissen, wenn du daran interessiert bist.'
