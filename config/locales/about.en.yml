    gratitude_heading: Gratitude
    gratitude_html: 'The Homosaurus Collective would like to thank our fabulous collaborators: <a href="https://www.asexuality.org/">AVEN</a>, the <a href="https://blacklesbianarchives.substack.com/">Black Lesbian Archives</a>, <a href="https://www.colage.org/">COLAGE</a>, <a href="https://interactadvocates.org/">InterACT</a>, the <a href="https://leatherarchives.org/">Leather Archives &amp; Museum</a>, and the <a href="https://swahpca.wordpress.com/">Sex Work Activist Histories Project</a>. We would also like to thank the many users of the Homosaurus who have suggested terms and provided feedback over the years. In particular, we are grateful to Orla Egan, Alice Galvinhill, Ellen Greenblatt, Juniper Johnson, Dee Michel, Cailin Roles, and Lydia Willoughby for their contributions.'
    memoriam_heading: In Memoriam
    memoriam_html: |-
      <p><strong>Walter <q>Cat</q> Walker</strong> served as the Head Cataloging Librarian at Loyola Marymount University in Los Angeles, California from 2004 until his untimely death in 2020. He was also a Director-at-Large of the American Library Association’s Gay Lesbian Bisexual Transgender Roundtable (<a href="https://www.ala.org/rrt">ALA GLBTRT</a>) and he volunteered at the <a href="https://one.usc.edu/">ONE National Gay &amp; Lesbian Archives</a> at the USC Libraries for 25 years.</p>

      <p>Cat Walker joined the Homosaurus Collective in 2016 after he met Jack van der Wel at the <a href="https://web.archive.org/web/20160709112621/http://lgbtqalms.co.uk/conference-programme/">LGBTQ ALMS</a> conference in London. At this conference, Cat presented a keynote titled <q>Overcoming the Barriers: Improving Access to LGBTQ+ Content in Collections.</q> Cat’s lifelong activism and passion for LGBTQ+ libraries and archives motivated him to join the Collective and he quickly became an active member of our team. At the next LGBTQ ALMS conference in Berlin in 2019, Cat and Jack presented a paper together on the Abridged Homosaurus.</p>

      <p>It is difficult to overstate Cat’s contributions to the Homosaurus over the four years that he worked on the project. As the Collective dramatically revised the first version of the Homosaurus, Cat played a central role in helping us to make use of many more terms and LGBTQ+-related contexts, representations, and histories. Cat worked extensively on reconciling Homosaurus version one to version two, examining the vocabulary with a close eye and pulling terms that required revision, lacked consistency across the list, or had a unique value that could be extended for related searches and needs. This list, composed of new suggested terms as well as adaptations of existing ones, was one of Cat’s most recent and ambitious contributions to the Collective’s work. At the time of his death, his documentation of related and suggested terms encompassed over 250 changes and/or new terms, important work that we will be sure to complete on his behalf and in his honor.</p>

      <p>Above all, Cat was a patient, kind, and gracious teacher and collaborator and he was always the first to volunteer to take on new projects. Cat’s attention to detail, as well as his commitment to making the Homosaurus a truly beautiful and inclusive set of terms, will be impossible to replace. We are endlessly grateful to him as we celebrate all that he contributed to this important project.</p>
