    mission_heading: "Mission"
    mission_statement: "The Homosaurus is an international linked data vocabulary of LGBTQ+ terms. Designed to enhance broad subject term vocabularies, the Homosaurus is a robust and cutting-edge thesaurus that advances the discoverability of LGBTQ+ resources and information."
    page_title: "About the Homosaurus"
    history_heading: "History"
    history_html: "The Homosaurus was originally created in 1997 by <a href=\"https://www.ihlia.nl/?lang=en\">IHLIA LGBTI Heritage</a> as a Dutch and English gay and lesbian thesaurus that was used as a standalone vocabulary to describe their collections. In 2013, Jack van der Wel, with the help of Ellen Greenblatt, transformed the original Homosaurus into a more inclusive and hierarchical thesaurus. In 2015, the <a href=\"https://www.digitaltransgenderarchive.net\">Digital Transgender Archive</a> (DTA) became one of the handful of LGBTQ+ archives using the <a href=\"/terms\">first version</a> of the Homosaurus, and the DTA’s Director, K.J. Rawson, collaborated with Jack van der Wel to transform it into an online linked data vocabulary. In 2016, Rawson and van der Wel established an Editorial Board to oversee a <a href=\"/v2\">second major revision</a>, released in May 2019, which transformed the Homosaurus into an LGBTQ+-specific vocabulary intended to supplement existing thesauri, followed by <a href=\"/v3\">version 3</a> in September 2021. <a href=\"/v4\">Version 4</a>, released in February 2025, added Spanish translations, and its later updates took the vocabulary past 4,000 terms. <a href=\"/v5\">Version 5</a>, released in June 2026, added translations in Dutch, French, German, Japanese and Swedish. The former Editorial Board is now the Homosaurus Collective."
