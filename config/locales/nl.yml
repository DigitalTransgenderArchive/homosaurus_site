    message: "Je bericht"
    message_html: "Als je de Homosaurus gebruikt, horen we graag van je! Laat ons weten hoe je deze woordenlijst gebruikt en deel je eventuele feedback met ons. We werven ook af en toe nieuwe leden voor het Collectief, dus laat het ons weten als je daarin geïnteresseerd bent.</br>De Homosaurus is een werk in uitvoering en we staan open voor suggesties voor nieuwe termen die kunnen worden toegevoegd of wijzigingen die in de woordenlijst kunnen worden aangebracht. Het Homosaurus-collectief houdt toezicht op het onderhoud van de woordenlijst en zal alle voorgestelde termen en wijzigingen elk kwartaal in overweging nemen."
