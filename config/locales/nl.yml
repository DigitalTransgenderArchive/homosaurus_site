    msg_2_html: Gepubliceerd onder <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/deed.nl">Creative Commons Attribution-NonCommercial-NoDerivatives 4.0 International license (CC BY-NC-ND 4.0)</a>
  homepage:
    welcome_html: '<p>Welkom bij de Homosaurus! De Homosaurus is een internationale linked data thesaurus van termen op het gebied van Lesbisch, Homoseksueel, Biseksueel, Transgender en Queer (LHBTQ+). Deze thesaurus is bedoeld als een aanvulling op bredere thesauri, zoals de Library of Congress Subject Headings. Bibliotheken, archieven, musea en andere instanties worden aangemoedigd om de Homosaurus te gebruiken om LHBTQ+-onderzoek te ondersteunen door de vindbaarheid van hun LHBTQ+-bronnen te vergroten.</p><p>Als je geïnteresseerd bent in Homosaurus-merchandise, kan je een kijkje nemen in onze <a href="https://homosaurus.threadless.com">webwinkel</a>. Alle opbrengsten worden gebruikt om het project te ondersteunen of worden gedoneerd aan LHBTQ+-organisaties.</p><p>Als je de Homosaurus gebruikt, horen we graag van je! <a href="%{contact_path}">Neem contact met ons op</a> om te laten weten hoe je deze woordenlijst gebruikt en om eventuele feedback te delen. Je kunt je ook aansluiten bij onze community op <a href="https://groups.google.com/g/homoitcommunity">Google Groups</a>.</p>'
