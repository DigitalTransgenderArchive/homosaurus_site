  homepage:
    welcome_html: "<p>Ti diamo il benvenuto in Homosaurus! Homosaurus è un vocabolario linked data internazionale di termini lesbici, gay, bisessuali, transgender e queer (LGBTQ). È pensato come complemento ai soggettari generali, come i Library of Congress Subject Headings. Invitiamo biblioteche, archivi, musei e altre istituzioni a usare Homosaurus per sostenere la ricerca LGBTQ e rendere più facili da trovare le loro risorse LGBTQ.</p><p>Se ti interessa acquistare qualche gadget di Homosaurus, visita il nostro <a href=\"https://homosaurus.threadless.com\">negozio online</a>. Tutti i ricavi servono a sostenere il progetto o vengono donati a organizzazioni LGBTQ+.</p><p>Se utilizzi Homosaurus, ci farebbe piacere sentirti! <a href=\"%{contact_path}\">Contattaci</a> per raccontarci come utilizzi questo vocabolario e per condividere le tue osservazioni. Puoi anche unirti alla nostra comunità su <a href=\"https://groups.google.com/g/homoitcommunity\">Google Groups</a>.</p>"
