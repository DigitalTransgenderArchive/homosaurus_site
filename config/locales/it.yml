    message: "Il tuo messaggio"
    message_html: "Se utilizzi Homosaurus, ci farebbe piacere sentirti! Scrivici per raccontarci come utilizzi questo vocabolario e per condividere le tue osservazioni. Siamo anche apertə all'ingresso di nuove persone nel nostro Collettivo: facci sapere se ti interessa.</br>Homosaurus è un progetto in continua evoluzione e accogliamo volentieri proposte di nuovi termini da aggiungere o di modifiche al vocabolario. Il Collettivo Homosaurus cura la manutenzione del vocabolario ed esamina ogni trimestre tutti i termini e le modifiche proposti."
