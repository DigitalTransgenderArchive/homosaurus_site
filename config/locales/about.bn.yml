    organizing_description: 'সংগঠন বোর্ড পুরো প্রকল্প জুড়ে সমন্বয়, দিকনির্দেশনা ও পরামর্শ প্রদান করে এবং কালেকটিভের বিকাশ ও প্রসারে সহায়তা করে: তহবিল সন্ধান, সম্মেলন আয়োজন এবং অংশীদারিত্ব চিহ্নিত করা এর কাজ। এই বোর্ডের অধীনে রয়েছে সিস্টেম উপকমিটি, যা সফটওয়্যারের কার্যকারিতার উপর মনোযোগ দেয় এবং ডেভেলপারদের সঙ্গে সমন্বয় করে।'
