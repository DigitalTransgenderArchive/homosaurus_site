    gratitude_heading: কৃতজ্ঞতা
    gratitude_html: 'হোমোসরাস কালেকটিভ আমাদের চমৎকার সহযোগীদের ধন্যবাদ জানাতে চায়: <a href="https://www.asexuality.org/">AVEN</a>, <a href="https://blacklesbianarchives.substack.com/">Black Lesbian Archives</a>, <a href="https://www.colage.org/">COLAGE</a>, <a href="https://interactadvocates.org/">InterACT</a>, <a href="https://leatherarchives.org/">Leather Archives &amp; Museum</a> এবং <a href="https://swahpca.wordpress.com/">Sex Work Activist Histories Project</a>। আমরা হোমোসরাসের অনেক ব্যবহারকারীকে ধন্যবাদ জানাতে চাই যারা বছরের পর বছর ধরে পদ প্রস্তাব করেছেন এবং মতামত প্রদান করেছেন। বিশেষ করে, আমরা Orla Egan, Alice Galvinhill, Ellen Greenblatt, Juniper Johnson, Dee Michel, Cailin Roles এবং Lydia Willoughby-র প্রতি তাদের অবদানের জন্য কৃতজ্ঞ।'
    memoriam_heading: স্মরণে
    memoriam_html: |-
      <p><strong>ওয়াল্টার <q>ক্যাট</q> ওয়াকার</strong> 2004 সাল থেকে 2020 সালে তার অকাল মৃত্যু পর্যন্ত ক্যালিফোর্নিয়ার লস অ্যাঞ্জেলেসের লয়োলা মেরিমাউন্ট ইউনিভার্সিটিতে প্রধান ক্যাটালগিং লাইব্রেরিয়ান হিসেবে দায়িত্ব পালন করেন। এছাড়াও তিনি আমেরিকান লাইব্রেরি অ্যাসোসিয়েশনের গে লেসবিয়ান বাইসেক্সুয়াল ট্রান্সজেন্ডার রাউন্ডটেবিল (<a href="https://www.ala.org/rrt">ALA GLBTRT</a>)-এর একজন ডিরেক্টর-এট-লার্জ ছিলেন এবং তিনি 25 বছর ধরে USC লাইব্রেরিতে <a href="https://one.usc.edu/">ONE National Gay &amp; Lesbian Archives</a>-এ স্বেচ্ছাসেবক ছিলেন।</p>

      <p>ক্যাট ওয়াকার 2016 সালে লন্ডনে <a href="https://web.archive.org/web/20160709112621/http://lgbtqalms.co.uk/conference-programme/">LGBTQ ALMS</a> সম্মেলনে জ্যাক ভ্যান ডার ওয়েলের সাথে দেখা করার পরে হোমোসরাস কালেকটিভে যোগদান করেন। এই কনফারেন্সে, ক্যাট <q>বাধা অতিক্রম করা: সংগ্রহে LGBTQ+ বিষয়বস্তুতে অ্যাক্সেসের উন্নতি</q> শিরোনামে একটি মূল বক্তব্য উপস্থাপন করেন। ক্যাটের আজীবন সক্রিয়তা এবং LGBTQ+ লাইব্রেরি এবং আর্কাইভের প্রতি আবেগ তাকে কালেকটিভে যোগদান করতে অনুপ্রাণিত করেছিল এবং সে দ্রুত আমাদের দলের একজন সক্রিয় সদস্য হয়ে ওঠে। 2019 সালে বার্লিনে পরবর্তী LGBTQ ALMS সম্মেলনে, ক্যাট এবং জ্যাক সংক্ষিপ্ত হোমোসরাসের উপর একসাথে একটি গবেষণাপত্র উপস্থাপন করেছিলেন।</p>

      <p>যে চার বছর তিনি প্রকল্পে কাজ করেছেন, তাতে হোমোসরাসে ক্যাটের অবদানের কথা তুলে ধরা কঠিন। যেহেতু কালেকটিভ নাটকীয়ভাবে হোমোসরাসের প্রথম সংস্করণটি সংশোধন করেছে, ক্যাট আমাদের আরও অনেক পদ এবং LGBTQ+-সম্পর্কিত প্রসঙ্গ, উপস্থাপনা এবং ইতিহাস ব্যবহার করতে সাহায্য করার জন্য একটি কেন্দ্রীয় ভূমিকা পালন করেছে। ক্যাট হোমোসরাস সংস্করণ 1 থেকে সংস্করণ 2-এর সমন্বয় সাধনে ব্যাপকভাবে কাজ করেছে, শব্দভাণ্ডারটি ঘনিষ্ঠ দৃষ্টিতে পরীক্ষা করেছে এবং সেইসব পদ বেছে নিয়েছে যেগুলির পরিমার্জন প্রয়োজন ছিল, যেগুলিতে তালিকা জুড়ে ধারাবাহিকতার অভাব ছিল বা যেগুলির এমন অনন্য মান ছিল যা সম্পর্কিত অনুসন্ধান এবং প্রয়োজনের জন্য প্রসারিত করা যেতে পারে। এই তালিকা, নতুন প্রস্তাবিত পদগুলির পাশাপাশি বিদ্যমানগুলির অভিযোজনগুলির সমন্বয়ে গঠিত, কালেকটিভের কাজে ক্যাটের সাম্প্রতিকতম এবং উচ্চাভিলাষী অবদানগুলির মধ্যে একটি। তার মৃত্যুর সময়, তার সম্পর্কিত এবং প্রস্তাবিত পদের ডকুমেন্টেশনে 250টিরও বেশি পরিবর্তন এবং/অথবা নতুন পদ ছিল, এটি গুরুত্বপূর্ণ কাজ যা আমরা তার পক্ষে এবং তার সম্মানে সম্পূর্ণ করতে নিশ্চিত হব।</p>

      <p>সর্বোপরি, ক্যাট একজন ধৈর্যশীল, সদয় এবং করুণাময় শিক্ষক এবং সহযোগী ছিলেন এবং তিনি সর্বদা নতুন প্রকল্প গ্রহণের জন্য স্বেচ্ছাসেবক ছিলেন। বিশদের প্রতি ক্যাটের মনোযোগ, সেইসাথে হোমোসরাসকে সত্যিকারের সুন্দর এবং অন্তর্ভুক্তিমূলক পরিভাষা তৈরি করার প্রতিশ্রুতি প্রতিস্থাপন করা অসম্ভব। এই গুরুত্বপূর্ণ প্রকল্পে তিনি যে অবদান রেখেছেন তা উদযাপন করার সময় আমরা তার প্রতি অশেষ কৃতজ্ঞ।</p>
