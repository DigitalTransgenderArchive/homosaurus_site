    implementation_description: 'বাস্তবায়ন বোর্ড বাইরের প্রতিষ্ঠানগুলির সঙ্গে মিলে হোমোসরাসের বাস্তবায়নে কাজ করে: অভ্যন্তরীণ ও বাহ্যিক উভয় ধরনের প্রশিক্ষণ-পদ্ধতি গড়ে তোলে, বাস্তবায়ন-সহায়ক উপকরণ তৈরি করে এবং হোমোসরাসের ব্যবহার, এর গবেষণাভিত্তিক প্রয়োগ ও এ বিষয়ে লেখালেখির হিসাব রাখে।'
    term_development_heading: পদ উন্নয়ন বোর্ড
    term_development_description: পদ উন্নয়ন বোর্ড ভাষা-নির্বিশেষে কাজে সহায়তা করে এবং পদ উন্নয়ন কমিটিগুলির মধ্যে সমন্বয় করে। এই বোর্ড ডাচ, ইংরেজি, ফরাসি, জার্মান, হিন্দি ও বাংলা, জাপানি, স্প্যানিশ এবং সুইডিশ ভাষা-নির্দিষ্ট কমিটিগুলির তত্ত্বাবধান করে, যেগুলি দীর্ঘমেয়াদে চলমান, পাশাপাশি তদর্থক বিষয়ভিত্তিক কমিটিগুলিরও, যেমন প্যাসিফিকা/ওশেনিয়া কমিটি, যেগুলি অস্থায়ী প্রকৃতির।
