bn:
  about_page:
    mission_heading: "উদ্দেশ্য"
    mission_statement: "হোমোসরাস হল LGBTQ+ শব্দাবলির একটি আন্তর্জাতিক লিঙ্কযুক্ত ডেটা শব্দভাণ্ডার । বিস্তৃত বিষয় শব্দভাণ্ডার উন্নত করার জন্য ডিজাইন করা হয়েছে, হোমোসরাস একটি শক্তিশালী এবং অত্যাধুনিক শব্দভাণ্ডার যা LGBTQ+ সংস্থান এবং তথ্যের আবিষ্কারকে এগিয়ে নিয়ে যায় ।"
    page_title: "হোমোসরাস সম্পর্কে"
    history_heading: "ইতিহাস"
    history_html: "হোমোসরাস মূলত 1997 সালে <a href=\"https://www.ihlia.nl/?lang=en\">আইএইচএলআইএ এলজিবিটিআই হেরিটেজ</a> দ্বারা একটি ডাচ এবং ইংরেজি গে এবং লেসবিয়ান থিসরাস হিসাবে তৈরি করা হয়েছিল যা তাদের সংগ্রহগুলি বর্ণনা করার জন্য একটি স্বতন্ত্র শব্দভাণ্ডার হিসাবে ব্যবহৃত হয়েছিল। 2013 সালে, জ্যাক ভ্যান ডার ওয়েল, Ellen Greenblatt-এর সহায়তায়, মূল হোমোসরাসকে আরও অন্তর্ভুক্তিমূলক এবং শ্রেণিবদ্ধ থিসরাসে রূপান্তরিত করেছিলেন। 2015 সালে, <a href=\"https://www.digitaltransgenderarchive.net\">ডিজিটাল ট্রান্সজেন্ডার আর্কাইভ</a> (DTA) হোমোসরাসের <a href=\"/terms\">প্রথম সংস্করণ</a> ব্যবহারকারী মুষ্টিমেয় LGBTQ+ সংরক্ষণাগারগুলির মধ্যে একটি হয়ে উঠেছিল, এবং DTA-এর পরিচালক কে.জে. রসন জ্যাক ভ্যান ডার ওয়েলের সাথে এটিকে একটি অনলাইন লিঙ্কযুক্ত ডেটা শব্দভাণ্ডারে রূপান্তরিত করতে সহযোগিতা করেছিলেন। 2016 সালে, রসন এবং ভ্যান ডার ওয়েল হোমোসরাসের <a href=\"/v2\">দ্বিতীয় প্রধান সংশোধনের</a> (2019 সালের মে মাসে প্রকাশিত) তদারকি করার জন্য একটি সম্পাদকীয় বোর্ড প্রতিষ্ঠা করেন, যে সংশোধন হোমোসরাসকে একটি LGBTQ+-নির্দিষ্ট শব্দভাণ্ডারে রূপান্তরিত করে, যা বিদ্যমান থিসরাসের পরিপূরক হওয়ার উদ্দেশ্যে তৈরি, এবং 2021 সালের সেপ্টেম্বরে <a href=\"/v3\">সংস্করণ 3</a> প্রকাশিত হয়। 2025 সালের ফেব্রুয়ারিতে প্রকাশিত <a href=\"/v4\">সংস্করণ 4</a>-এ স্প্যানিশ অনুবাদ যোগ করা হয়, এবং পরবর্তী হালনাগাদগুলোতে শব্দভাণ্ডার 4,000-এর বেশি পরিভাষায় পৌঁছায়। 2026 সালের জুনে প্রকাশিত <a href=\"/v5\">সংস্করণ 5</a>-এ ডাচ, ফরাসি, জার্মান, জাপানি ও সুইডিশ অনুবাদ যোগ করা হয়। প্রাক্তন সম্পাদকীয় বোর্ড এখন হোমোসরাস কালেকটিভ।"
    emails_revealed: পৃষ্ঠায় থাকা ইমেইল ঠিকানাগুলি এখন দেখানো হয়েছে।
    collective_heading: হোমোসরাস কালেকটিভ
    collective_intro: 'হোমোসরাস কালেকটিভে 9টি দেশের 40-এরও বেশি সদস্য রয়েছেন, যারা তিনটি পরস্পর-নির্ভর বোর্ডে বিভক্ত: সংগঠন বোর্ড, বাস্তবায়ন বোর্ড এবং পদ উন্নয়ন বোর্ড।'
