  about_page:
    mission_heading: "Misión"
    mission_statement: "El Homosaurus es un vocabulario internacional de datos vinculados de términos LGBTQ+. Diseñado para mejorar vocabulario de términos temáticos amplios, Homosaurus es un tesauro robusto e innovador que promueve la capacidad de descubrimiento de recursos e información LGBTQ+."
    page_title: "Acerca del Homosaurus"
    history_heading: "Historia"
    history_html: "El Homosaurus fue creado originalmente en 1997 por <a href=\"https://www.ihlia.nl/?lang=en\">IHLIA LGBTI Heritage</a> como un tesauro gay y lésbico en neerlandés e inglés que se utilizó como vocabulario independiente para describir sus colecciones. En 2013, Jack van der Wel, con la ayuda de Ellen Greenblatt, transformó el Homosaurus original en un tesauro más inclusivo y jerárquico. En 2015, el <a href=\"https://www.digitaltransgenderarchive.net\">Digital Transgender Archive</a> (DTA) se convirtió en uno del puñado de archivos LGBTQ+ que utilizaban la <a href=\"/terms\">primera versión</a> del Homosaurus, y la dirección del DTA, a cargo de K.J. Rawson, colaboró con Jack van der Wel para transformarla en un vocabulario de datos vinculados en línea. En 2016, Rawson y van der Wel establecieron un consejo editorial para supervisar una <a href=\"/v2\">segunda gran revisión</a>, publicada en mayo de 2019, que transformó el Homosaurus en un vocabulario específico para LGBTQ+, cuyo objetivo era complementar los tesauros existentes, seguida de la <a href=\"/v3\">versión 3</a> en septiembre de 2021. La <a href=\"/v4\">versión 4</a>, publicada en febrero de 2025, incorporó traducciones al español, y con sus actualizaciones posteriores el vocabulario superó los 4000 términos. La <a href=\"/v5\">versión 5</a>, publicada en junio de 2026, añadió traducciones al alemán, francés, japonés, neerlandés y sueco. El antiguo consejo editorial es hoy el Colectivo Homosaurus."
    emails_revealed: Los correos electrónicos de la página ahora están visibles.
