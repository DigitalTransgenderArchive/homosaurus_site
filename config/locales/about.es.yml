    gratitude_heading: Gratitud
    gratitude_html: 'El Colectivo Homosaurus quisiera agradecer a nuestras fabulosas organizaciones colaboradoras: <a href="https://www.asexuality.org/">AVEN</a>, <a href="https://blacklesbianarchives.substack.com/">Black Lesbian Archives</a>, <a href="https://www.colage.org/">COLAGE</a>, <a href="https://interactadvocates.org/">InterACT</a>, <a href="https://leatherarchives.org/">Leather Archives &amp; Museum</a> y <a href="https://swahpca.wordpress.com/">Sex Work Activist Histories Project</a>. También nos gustaría agradecer a las numerosas personas usuarias del Homosaurus que han sugerido términos y proporcionado comentarios a lo largo de los años. En particular, agradecemos a Orla Egan, Alice Galvinhill, Ellen Greenblatt, Juniper Johnson, Dee Michel, Cailin Roles y Lydia Willoughby por sus contribuciones.'
    memoriam_heading: In memoriam
    memoriam_html: |-
      <p><strong>Walter <q>Cat</q> Walker</strong> fue Bibliotecario Jefe de Catalogación en la Loyola Marymount University en Los Ángeles, California, desde 2004 hasta su prematura muerte en 2020. También fue Director General de la American Library Association’s Gay Lesbian Bisexual Transgender Roundtable (<a href="https://www.ala.org/rrt">ALA GLBTRT</a>) y trabajó como voluntario en los <a href="https://one.usc.edu/">ONE National Gay &amp; Lesbian Archives</a> de las USC Libraries durante 25 años.</p>

      <p>Cat Walker se unió al Colectivo Homosaurus en 2016 después de conocer a Jack van der Wel en la conferencia <a href="https://web.archive.org/web/20160709112621/http://lgbtqalms.co.uk/conference-programme/">LGBTQ ALMS</a> en Londres. En esta conferencia, Cat presentó una ponencia magistral titulada <q>Superando las barreras: Mejorando el Acceso al Contenido LGBTQ+ en las Colecciones.</q> El activismo de toda la vida de Cat y su pasión por las bibliotecas y archivos LGBTQ+ le motivaron a unirse al Colectivo y rápidamente se convirtió en un miembro activo de nuestro equipo. En la próxima conferencia LGBTQ ALMS en Berlín en 2019, Cat y Jack presentaron un trabajo juntos sobre el Homosaurus Abridged.</p>

      <p>Es difícil exagerar las contribuciones de Cat al Homosaurus durante los cuatro años que trabajó en el proyecto. Cuando el Colectivo revisó drásticamente la primera versión del Homosaurus, Cat desempeñó un papel fundamental al ayudarnos a utilizar muchos más términos y contextos, representaciones e historias relacionados con la comunidad LGBTQ+. Cat trabajó intensamente en la reconciliación de la versión uno del Homosaurus con la versión dos, examinando el vocabulario con lupa y extrayendo términos que requerían revisión, carecían de coherencia en toda la lista o tenían un valor único que podía ampliarse para búsquedas y necesidades relacionadas. Esta lista, compuesta por nuevos términos sugeridos y por adaptaciones de otros ya existentes, fue una de las contribuciones más recientes y ambiciosas de Cat al trabajo del Colectivo. En el momento de su muerte, su documentación de términos relacionados y sugeridos abarcaba más de 250 cambios y/o nuevos términos, un trabajo importante que nos aseguraremos de completar en su nombre y en su honor.</p>

      <p>Por encima de todo, Cat era un profesor y colaborador paciente, amable y gentil, y siempre era el primero en ofrecerse voluntario para asumir nuevos proyectos. La atención de Cat por el detalle, así como su compromiso por hacer del Homosaurus un conjunto de términos verdaderamente bello e inclusivo, serán imposibles de reemplazar. Le estamos infinitamente agradecidos y celebramos todo lo que ha aportado a este importante proyecto.</p>
