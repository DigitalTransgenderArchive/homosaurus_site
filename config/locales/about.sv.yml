  about_page:
    mission_heading: "Uppdrag"
    mission_statement: "Homosaurus är en internationell tesaurus med länkade data-termer rörande hbtq+-ämnen. Homosaurus är en stabil och banbrytande tesaurus, framtagen för att komplettera generella ämnesordssystem och göra det lättare att hitta hbtq+-resurser och -information."
    page_title: "Om Homosaurus"
    history_heading: "Historik"
    history_html: "Homosaurus skapades ursprungligen 1997 av <a href=\"https://www.ihlia.nl/?lang=en\">IHLIA LGBTI Heritage</a> som en holländsk och engelsk tesaurus för gay och lesbiska, som användes som en fristående vokabulär för att beskriva deras samlingar. År 2013 omvandlade Jack van der Wel, med hjälp av Ellen Greenblatt, den ursprungliga Homosaurus till en mer inkluderande och hierarkisk tesaurus. År 2015 blev <a href=\"https://www.digitaltransgenderarchive.net\">Digital Transgender Archive</a> (DTA) ett av de få hbtq+-arkiv som använde den <a href=\"/terms\">första versionen</a> av Homosaurus, och DTA:s chef K.J. Rawson samarbetade med Jack van der Wel för att omvandla den till en onlinevokabulär med länkade data. År 2016 inrättade Rawson och van der Wel en redaktion som skulle övervaka en <a href=\"/v2\">andra större revidering</a>, publicerad i maj 2019, vilken förvandlade Homosaurus till en hbtq+-specifik vokabulär avsedd att komplettera befintliga tesaurusar, följd av <a href=\"/v3\">version 3</a> i september 2021. <a href=\"/v4\">Version 4</a>, som publicerades i februari 2025, lade till spanska översättningar, och med de senare uppdateringarna växte vokabulären till över 4 000 termer. <a href=\"/v5\">Version 5</a>, som publicerades i juni 2026, lade till översättningar till franska, japanska, nederländska, svenska och tyska. Den tidigare redaktionen är i dag Homosaurus-kollektivet."
