    gratitude_heading: "Tacksamhet"
    gratitude_html: 'Homosaurus-kollektivet vill tacka våra fantastiska samarbetspartner: <a href="https://www.asexuality.org/">AVEN</a>, <a href="https://blacklesbianarchives.substack.com/">Black Lesbian Archives</a>, <a href="https://www.colage.org/">COLAGE</a>, <a href="https://interactadvocates.org/">InterACT</a>, <a href="https://leatherarchives.org/">Leather Archives &amp; Museum</a> och <a href="https://swahpca.wordpress.com/">Sex Work Activist Histories Project</a>. Vi vill också tacka de många användarna av Homosaurus som har föreslagit termer och gett feedback genom åren. Särskilt tacksamma är vi mot Orla Egan, Alice Galvinhill, Ellen Greenblatt, Juniper Johnson, Dee Michel, Cailin Roles och Lydia Willoughby för deras bidrag.'
    memoriam_heading: Till minne av
    memoriam_html: |-
      <p><strong>Walter <q>Cat</q> Walker</strong> var ansvarig katalogisatör vid Loyola Marymount University i Los Angeles, Kalifornien från 2004 fram till sin för tidiga död 2020. Han var också en director-at-large för American Library Associations Gay Lesbian Bisexual Transgender Roundtable (<a href="https://www.ala.org/rrt">ALA GLBTRT</a>) och han volontärarbetade vid <a href="https://one.usc.edu/">ONE National Gay &amp; Lesbian Archives</a> vid USC Libraries i 25 år.</p>

      <p>Cat Walker gick med i Homosaurus-kollektivet 2016 efter att ha träffat Jack van der Wel på <a href="https://web.archive.org/web/20160709112621/http://lgbtqalms.co.uk/conference-programme/">LGBTQ ALMS</a>-konferensen i London. Vid denna konferens presenterade Cat ett huvudanförande med titeln <q>Overcoming the Barriers: Improving Access to LGBTQ+ Content in Collections.</q> Cats livslånga aktivism och passion för hbtq+-bibliotek och arkiv fick honom att gå med i kollektivet och han blev snabbt en aktiv medlem i vårt team. Vid nästa LGBTQ ALMS-konferens i Berlin 2019 presenterade Cat och Jack tillsammans en uppsats om den förkortade versionen av Homosaurus.</p>

      <p>Det är svårt att överdriva Cats bidrag till Homosaurus under de fyra år han arbetade med projektet. När kollektivet dramatiskt reviderade den första versionen av Homosaurus spelade Cat en central roll i att hjälpa oss att använda många fler termer och hbtq+-relaterade sammanhang, representationer och historier. Cat arbetade omfattande med att sammanfoga Homosaurus version ett med version två, granskade vokabulären noggrant och identifierade termer som behövde revideras, saknade konsistens över listan, eller hade ett unikt värde som kunde utvidgas för relaterade sökningar och behov. Denna lista, bestående av nya föreslagna termer samt anpassningar av befintliga, var ett av Cats senaste och mest ambitiösa bidrag till kollektivets arbete. Vid tiden för hans död omfattade hans dokumentation av relaterade och föreslagna termer över 250 förändringar och/eller nya termer, viktigt arbete som vi kommer att slutföra för hans räkning och till hans ära.</p>

      <p>Framför allt var Cat en tålmodig, vänlig och välvillig lärare och samarbetspartner, och han var alltid den första att anmäla sig för att ta på sig nya projekt. Cats öga för detaljer, samt hans engagemang för att göra Homosaurus till en verkligt vacker och inkluderande uppsättning termer, kommer att vara omöjliga att ersätta. Vi är oändligt tacksamma för honom och hedrar alla hans bidrag till detta viktiga projekt.</p>
