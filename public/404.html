<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Page not found | Homosaurus</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      color: #212529;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
    }

    body::before {
      content: "";
      height: 0.5rem;
      background: linear-gradient(90deg, #e02020 0 16.66%, #f08018 0 33.33%, #f8c028 0 50%, #00a850 0 66.66%, #00a0d8 0 83.33%, #783898 0);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem 4rem;
      text-align: center;
    }

    img {
      display: block;
      width: min(20rem, 75vw);
      height: auto;
    }

    h1 {
      margin: 2.5rem 0 0.75rem;
      font-size: clamp(1.75rem, 6vw, 2.5rem);
      line-height: 1.2;
    }

    p {
      max-width: 28rem;
      margin: 0 0 2rem;
      color: #6c757d;
      font-size: 1.125rem;
    }

    a {
      padding: 0.65rem 1.5rem;
      border-radius: 999px;
      background: #c8105f;
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }

    a:hover {
      background: #a80d50;
    }

    a:focus-visible {
      outline: 3px solid #00a0d8;
      outline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <img src="/homosaurus_logo.png" width="320" height="200" alt="Homosaurus">
    <h1>Page not found</h1>
    <p>You may have mistyped the address<br>or the page may have moved</p>
    <a href="/">Go to the homepage</a>
  </main>
</body>
</html>
